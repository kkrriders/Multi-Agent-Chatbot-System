services:

  # ── Infrastructure ────────────────────────────────────────────────────────────
  # MongoDB is NOT run here — point MONGODB_URI in .env at MongoDB Atlas (free tier).
  # Frontend is NOT run here — it's deployed separately on Vercel.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Backend (Express on :3000, internal only) ─────────────────────────────────

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      # MONGODB_URI, FRONTEND_URL (your Vercel domain) come from .env
      REDIS_URL: redis://redis:6379
      PORT: "3000"
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ./logs:/app/logs

  # ── Nginx reverse proxy (public: 80 + 443) — proxies straight to backend ──────

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - backend

  # ── Certbot (run once to issue / renew SSL cert) ──────────────────────────────
  # Usage: docker compose run --rm certbot
  # Renewal: docker compose run --rm certbot renew  (add to cron weekly)

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      certbot certonly --webroot
      --webroot-path=/var/www/certbot
      --email YOUR_EMAIL
      --agree-tos
      --no-eff-email
      -d YOUR_DOMAIN
    profiles: ["ssl"]

  # ── Optional: Jaeger distributed tracing ─────────────────────────────────────

  jaeger:
    image: jaegertracing/all-in-one:latest
    profiles: ["tracing"]
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "4318:4318"
      - "16686:16686"

volumes:
  redis_data:
  certbot_certs:
  certbot_www:
